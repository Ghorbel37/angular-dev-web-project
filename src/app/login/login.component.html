<div style="text-align: center;">
  <form (ngSubmit)="login()">
    <mat-form-field appearance="fill">
      <mat-label>Email</mat-label>
      <input matInput type="email" name="email" [(ngModel)]="email" required />
    </mat-form-field>
    <mat-form-field appearance="fill">
      <mat-label>Mot de passe</mat-label>
      <input matInput type="password" name="password" [(ngModel)]="password" required />
    </mat-form-field>
    <button mat-raised-button color="primary" type="submit">Connecter</button>
    <div *ngIf="errorMessage" style="color: red; margin-top: 10px;">{{ errorMessage }}</div>
  </form>
</div>
