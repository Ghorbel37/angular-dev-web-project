<h2 mat-dialog-title>Add Publication</h2>

<mat-dialog-content [formGroup]="form" *ngIf="form">

  <mat-form-field>
    <input matInput placeholder="Titre" formControlName="titre">
  </mat-form-field>

  <mat-form-field>
    <input matInput placeholder="Type" formControlName="type">
  </mat-form-field>

  <mat-form-field>
    <input matInput [matDatepicker]="picker" placeholder="Date" formControlName="dateApparition">
    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>

  <mat-form-field>
    <input matInput placeholder="Lien" formControlName="lien">
  </mat-form-field>

  <mat-form-field>
    <input matInput placeholder="Source PDF (URL)" formControlName="sourcePdf">
  </mat-form-field>

</mat-dialog-content>

<mat-dialog-actions>
  <button mat-raised-button color="warn" (click)="close()">Close</button>
  <button mat-raised-button color="primary" (click)="save()">Save</button>
</mat-dialog-actions>
