<button mat-raised-button color="primary" (click)="openAddPublicationModal()">Add Publication</button>
<mat-form-field>
  <mat-label>Filter</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Smith" #input>
</mat-form-field>

<div class="mat-elevation-z8">
  <table mat-table [dataSource]="dataSource" matSort>

    <!-- ID Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
      <td mat-cell *matCellDef="let row"> {{row.id}} </td>
    </ng-container>

    <!-- Titre Column -->
    <ng-container matColumnDef="titre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Titre </th>
      <td mat-cell *matCellDef="let row"> {{row.titre}} </td>
    </ng-container>

    <!-- Type Column -->
    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Type </th>
      <td mat-cell *matCellDef="let row"> {{row.type}} </td>
    </ng-container>

    <!-- Date Column -->
    <ng-container matColumnDef="dateApparition">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Date </th>
      <td mat-cell *matCellDef="let row"> {{row.dateApparition | date}} </td>
    </ng-container>

    <!-- Lien Column -->
    <ng-container matColumnDef="lien">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Lien </th>
      <td mat-cell *matCellDef="let row"> <a href="{{row.lien}}" target="_blank">{{row.lien}}</a> </td>
    </ng-container>

    <!-- Source PDF Column -->
    <ng-container matColumnDef="sourcePdf">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Source PDF </th>
      <td mat-cell *matCellDef="let row"> <a href="{{row.sourcePdf}}" target="_blank">PDF</a> </td>
    </ng-container>

    <!-- Action Column -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Action </th>
      <td mat-cell *matCellDef="let row"><button mat-button (click)="openEditPublicationModal(row.id)"> <mat-icon color="primary">edit</mat-icon> </button> <button mat-button (click)="deletePublication(row.id)"> <mat-icon color="warn">delete</mat-icon> </button> </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <!-- Row shown when there is no matching data. -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="6">No data matching the filter "{{input.value}}"</td>
    </tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of Publications"></mat-paginator>
</div>
